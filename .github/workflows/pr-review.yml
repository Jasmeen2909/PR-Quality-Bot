name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff "$BASE_SHA" "$HEAD_SHA" > pr_diff.txt

      - name: Call review service
        env:
          SERVICE_URL: ${{ vars.SERVICE_URL }}
          SERVICE_AUTH_TOKEN: ${{ secrets.SERVICE_AUTH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          jq -n \
            --arg repo "$REPO" \
            --argjson pr_number "$PR_NUMBER" \
            --arg action "$ACTION" \
            --rawfile diff pr_diff.txt \
            '{repo: $repo, pr_number: $pr_number, action: $action, diff: $diff}' \
            > payload.json

          curl --silent --show-error --fail-with-body --max-time 300 \
            -X POST "$SERVICE_URL/api/review" \
            -H "Authorization: Bearer $SERVICE_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            --data @payload.json \
            --output review_response.json || {
               cat review_response.json
               exit 1
            }

          cat review_response.json
